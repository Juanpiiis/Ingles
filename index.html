<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .bg{
    background: linear-gradient(135deg,#4e73df,#1cc88a);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;
  }

  .contenedor{
    background:white;
    padding:30px;
    border-radius:15px;
    width:100%;
    max-width:700px;
    text-align:center;
  }

  h2{
    margin-bottom:18px;
    color:#333;
    font-size:22px;
  }

  .btn{
    padding:10px 24px;
    border:none;
    border-radius:8px;
    background:#36b9cc;
    color:white;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    margin-top:15px;
  }

  .btn:hover{
    background:#2c9faf;
  }

  .btn-menu{
    display:block;
    width:230px;
    margin:10px auto;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#1cc88a;
    color:white;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
  }

  .btn-menu:hover{
    background:#17a673;
  }

  .score-row{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:20px;
    flex-wrap:wrap;
  }

  .score-box{
    background:#f0f4ff;
    border-radius:10px;
    padding:10px 18px;
    min-width:100px;
  }

  .s-label{
    font-size:12px;
    color:#777;
  }

  .s-val{
    font-size:22px;
    font-weight:bold;
    color:#4e73df;
  }

  .progress{
    height:8px;
    background:#ddd;
    border-radius:5px;
    overflow:hidden;
    margin-bottom:20px;
  }

  .progress-fill{
    height:100%;
    background:#1cc88a;
    width:0%;
    transition:0.4s;
  }

  table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
  }

  th{
    background:#4e73df;
    color:white;
    padding:12px;
    font-size:15px;
  }

  td{
    border:1px solid #ddd;
    padding:14px;
    font-size:20px;
    font-weight:bold;
    color:#333;
  }

  tr:nth-child(even){
    background:#f8f9fc;
  }

  .final-emoji{
    font-size:50px;
    margin-bottom:10px;
  }
</style>

<div class="bg">

  <div class="contenedor">

    <div id="menu">
      <h2>🎯 Verbos Irregulares</h2>

      <p style="color:#777;margin-bottom:20px">
        Infinitive · Past Simple · Español
      </p>

      <button class="btn-menu" onclick="iniciar()">
        ▶ Empezar
      </button>
    </div>

    <div id="juego" style="display:none">

      <div class="score-row">

        <div class="score-box">
          <div class="s-label">Vistos</div>
          <div class="s-val" id="sc-ok">0</div>
        </div>

        <div class="score-box">
          <div class="s-label">Faltan</div>
          <div class="s-val" id="sc-left">50</div>
        </div>

      </div>

      <div class="progress">
        <div class="progress-fill" id="pbar"></div>
      </div>

      <div id="verbo-display"></div>

      <button class="btn" onclick="siguiente()">
        Siguiente ➜
      </button>

    </div>

    <div id="final" style="display:none">

      <div class="final-emoji">🏆</div>

      <h2>¡Terminaste!</h2>

      <p style="color:#777;margin:15px 0">
        Has repasado los 50 verbos.
      </p>

      <button class="btn-menu" onclick="reiniciar()">
        Jugar otra vez
      </button>

    </div>

  </div>

</div>

<script>

const verbos = [
  {inf:"be", ps:"was / were", esp:"ser / estar"},
  {inf:"become", ps:"became", esp:"convertirse"},
  {inf:"begin", ps:"began", esp:"empezar"},
  {inf:"bring", ps:"brought", esp:"traer"},
  {inf:"buy", ps:"bought", esp:"comprar"},
  {inf:"choose", ps:"chose", esp:"elegir"},
  {inf:"come", ps:"came", esp:"venir"},
  {inf:"do", ps:"did", esp:"hacer"},
  {inf:"drink", ps:"drank", esp:"beber"},
  {inf:"drive", ps:"drove", esp:"conducir"},
  {inf:"eat", ps:"ate", esp:"comer"},
  {inf:"fall", ps:"fell", esp:"caer"},
  {inf:"feel", ps:"felt", esp:"sentir"},
  {inf:"find", ps:"found", esp:"encontrar"},
  {inf:"fly", ps:"flew", esp:"volar"},
  {inf:"forget", ps:"forgot", esp:"olvidar"},
  {inf:"get", ps:"got", esp:"obtener"},
  {inf:"give", ps:"gave", esp:"dar"},
  {inf:"go", ps:"went", esp:"ir"},
  {inf:"have", ps:"had", esp:"tener"},
  {inf:"hear", ps:"heard", esp:"escuchar"},
  {inf:"keep", ps:"kept", esp:"guardar"},
  {inf:"know", ps:"knew", esp:"conocer"},
  {inf:"leave", ps:"left", esp:"dejar"},
  {inf:"lend", ps:"lent", esp:"prestar"},
  {inf:"let", ps:"let", esp:"permitir"},
  {inf:"lose", ps:"lost", esp:"perder"},
  {inf:"make", ps:"made", esp:"hacer"},
  {inf:"meet", ps:"met", esp:"conocer"},
  {inf:"pay", ps:"paid", esp:"pagar"},
  {inf:"put", ps:"put", esp:"poner"},
  {inf:"read", ps:"read", esp:"leer"},
  {inf:"run", ps:"ran", esp:"correr"},
  {inf:"say", ps:"said", esp:"decir"},
  {inf:"see", ps:"saw", esp:"ver"},
  {inf:"sell", ps:"sold", esp:"vender"},
  {inf:"send", ps:"sent", esp:"enviar"},
  {inf:"sing", ps:"sang", esp:"cantar"},
  {inf:"sit", ps:"sat", esp:"sentarse"},
  {inf:"sleep", ps:"slept", esp:"dormir"},
  {inf:"speak", ps:"spoke", esp:"hablar"},
  {inf:"stand", ps:"stood", esp:"pararse"},
  {inf:"swim", ps:"swam", esp:"nadar"},
  {inf:"take", ps:"took", esp:"tomar"},
  {inf:"teach", ps:"taught", esp:"enseñar"},
  {inf:"tell", ps:"told", esp:"contar"},
  {inf:"think", ps:"thought", esp:"pensar"},
  {inf:"understand", ps:"understood", esp:"entender"},
  {inf:"wear", ps:"wore", esp:"usar"},
  {inf:"write", ps:"wrote", esp:"escribir"}
];

let pendientes = [];
let vistos = 0;
let actual = null;

function shuffle(arr){

  let a = [...arr];

  for(let i = a.length - 1; i > 0; i--){

    let j = Math.floor(Math.random() * (i + 1));

    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}

function iniciar(){

  pendientes = shuffle([...verbos]);

  vistos = 0;

  document.getElementById("menu").style.display = "none";

  document.getElementById("juego").style.display = "block";

  document.getElementById("final").style.display = "none";

  actualizarScore();

  mostrarVerbo();
}

function mostrarVerbo(){

  if(pendientes.length === 0){

    mostrarFinal();

    return;
  }

  actual = pendientes[0];

  document.getElementById("verbo-display").innerHTML = `
  
    <table>

      <tr>
        <th>Infinitive</th>
        <th>Past Simple</th>
        <th>Español</th>
      </tr>

      <tr>
        <td>${actual.inf}</td>
        <td>${actual.ps}</td>
        <td>${actual.esp}</td>
      </tr>

    </table>
  `;
}

function siguiente(){

  pendientes.shift();

  vistos++;

  actualizarScore();

  mostrarVerbo();
}

function actualizarScore(){

  document.getElementById("sc-ok").textContent = vistos;

  document.getElementById("sc-left").textContent =
    pendientes.length;

  document.getElementById("pbar").style.width =
    ((vistos / verbos.length) * 100) + "%";
}

function mostrarFinal(){

  document.getElementById("juego").style.display = "none";

  document.getElementById("final").style.display = "block";
}

function reiniciar(){

  document.getElementById("final").style.display = "none";

  document.getElementById("menu").style.display = "block";
}

</script>
