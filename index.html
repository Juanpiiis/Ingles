
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .wrap { padding: 1.5rem 1rem; max-width: 620px; margin: 0 auto; font-family: var(--font-sans); }
  h2 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 6px; }
  p.sub { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 1.25rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
  .stat { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px; text-align: center; }
  .stat-label { font-size: 12px; color: var(--color-text-secondary); }
  .stat-val { font-size: 20px; font-weight: 500; color: var(--color-text-primary); }
  .pbar-wrap { height: 6px; background: var(--color-background-secondary); border-radius: 4px; margin-bottom: 1.25rem; overflow: hidden; }
  .pbar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.5rem; margin-bottom: 1.25rem; text-align: center; }
  .v-top { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; letter-spacing: 0.5px; text-transform: uppercase; }
  .v-main { font-size: 34px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 6px; }
  .v-sub { font-size: 13px; color: var(--color-text-secondary); }
  .hints { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .hint-box { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 6px 14px; text-align: center; }
  .hint-lbl { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 2px; }
  .hint-val { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
  .ask-badge { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: var(--border-radius-md); margin-top: 10px; font-weight: 500; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
  .opt { padding: 12px 8px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; font-size: 14px; font-weight: 500; text-align: center; transition: background 0.15s; }
  .opt:hover:not(:disabled) { background: var(--color-background-secondary); }
  .opt.correct { background: #d4edda; border-color: #1cc88a; color: #155724; }
  .opt.wrong { background: #f8d7da; border-color: #e24b4a; color: #721c24; }
  .feedback { font-size: 14px; font-weight: 500; min-height: 22px; margin-bottom: 1rem; text-align: center; }
  .feedback.ok { color: #1cc88a; }
  .feedback.no { color: #e24b4a; }
  .btn-next { width: 100%; padding: 11px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); font-size: 15px; font-weight: 500; cursor: pointer; }
  .btn-next:hover { background: var(--color-background-secondary); }
  .btn-start { width: 100%; padding: 12px; border: none; border-radius: var(--border-radius-md); color: white; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 1rem; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
  .mode-btn { padding: 10px 8px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-secondary); font-size: 13px; cursor: pointer; text-align: center; }
  .mode-btn.active { font-weight: 500; }
  .final-score { font-size: 46px; font-weight: 500; color: var(--color-text-primary); margin: 0.5rem 0; }
  .final-msg { font-size: 15px; color: var(--color-text-secondary); margin-bottom: 1.5rem; }
</style>

<div class="wrap">
  <h2>Verbos irregulares</h2>

  <div id="screen-menu">
    <p class="sub">Elige qué quieres practicar</p>
    <div class="modes" id="mode-grid"></div>
    <p class="sub" id="mode-desc" style="margin-top:4px"></p>
    <button class="btn-start" id="btn-start" onclick="iniciar()">Empezar</button>
  </div>

  <div id="screen-game" style="display:none">
    <div class="stats">
      <div class="stat"><div class="stat-label">Correctas</div><div class="stat-val" id="sc-ok">0</div></div>
      <div class="stat"><div class="stat-label">Incorrectas</div><div class="stat-val" id="sc-bad">0</div></div>
      <div class="stat"><div class="stat-label">Faltan</div><div class="stat-val" id="sc-left">50</div></div>
    </div>
    <div class="pbar-wrap"><div class="pbar-fill" id="pbar" style="width:0%"></div></div>
    <div class="card">
      <div class="v-top" id="v-top"></div>
      <div class="v-main" id="v-main"></div>
      <div class="v-sub" id="v-sub"></div>
      <div class="hints" id="hints"></div>
      <div class="ask-badge" id="ask-badge"></div>
    </div>
    <div class="options" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn-next" id="btn-next" style="display:none" onclick="siguiente()">Siguiente →</button>
  </div>

  <div id="screen-final" style="display:none">
    <div class="card" style="padding:2rem; text-align:center">
      <div style="font-size:40px;margin-bottom:8px" id="final-emoji">🏆</div>
      <div class="final-score" id="final-score"></div>
      <div class="final-msg" id="final-msg"></div>
      <button class="btn-start" id="btn-replay" onclick="volver()">Jugar otra vez</button>
    </div>
  </div>
</div>

<script>
const verbos = [
  {inf:"be",          ps:"was / were",  pp:"been",          esp:"ser / estar"},
  {inf:"become",      ps:"became",      pp:"become",        esp:"convertirse"},
  {inf:"begin",       ps:"began",       pp:"begun",         esp:"empezar"},
  {inf:"bring",       ps:"brought",     pp:"brought",       esp:"traer"},
  {inf:"buy",         ps:"bought",      pp:"bought",        esp:"comprar"},
  {inf:"choose",      ps:"chose",       pp:"chosen",        esp:"elegir"},
  {inf:"come",        ps:"came",        pp:"come",          esp:"venir"},
  {inf:"do",          ps:"did",         pp:"done",          esp:"hacer"},
  {inf:"drink",       ps:"drank",       pp:"drunk",         esp:"beber"},
  {inf:"drive",       ps:"drove",       pp:"driven",        esp:"conducir"},
  {inf:"eat",         ps:"ate",         pp:"eaten",         esp:"comer"},
  {inf:"fall",        ps:"fell",        pp:"fallen",        esp:"caer"},
  {inf:"feel",        ps:"felt",        pp:"felt",          esp:"sentir"},
  {inf:"find",        ps:"found",       pp:"found",         esp:"encontrar"},
  {inf:"fly",         ps:"flew",        pp:"flown",         esp:"volar"},
  {inf:"forget",      ps:"forgot",      pp:"forgotten",     esp:"olvidar"},
  {inf:"get",         ps:"got",         pp:"gotten / got",  esp:"obtener"},
  {inf:"give",        ps:"gave",        pp:"given",         esp:"dar"},
  {inf:"go",          ps:"went",        pp:"gone",          esp:"ir"},
  {inf:"have",        ps:"had",         pp:"had",           esp:"tener"},
  {inf:"hear",        ps:"heard",       pp:"heard",         esp:"escuchar"},
  {inf:"keep",        ps:"kept",        pp:"kept",          esp:"guardar"},
  {inf:"know",        ps:"knew",        pp:"known",         esp:"conocer"},
  {inf:"leave",       ps:"left",        pp:"left",          esp:"dejar"},
  {inf:"lend",        ps:"lent",        pp:"lent",          esp:"prestar"},
  {inf:"let",         ps:"let",         pp:"let",           esp:"permitir"},
  {inf:"lose",        ps:"lost",        pp:"lost",          esp:"perder"},
  {inf:"make",        ps:"made",        pp:"made",          esp:"hacer"},
  {inf:"meet",        ps:"met",         pp:"met",           esp:"conocer"},
  {inf:"pay",         ps:"paid",        pp:"paid",          esp:"pagar"},
  {inf:"put",         ps:"put",         pp:"put",           esp:"poner"},
  {inf:"read",        ps:"read",        pp:"read",          esp:"leer"},
  {inf:"run",         ps:"ran",         pp:"run",           esp:"correr"},
  {inf:"say",         ps:"said",        pp:"said",          esp:"decir"},
  {inf:"see",         ps:"saw",         pp:"seen",          esp:"ver"},
  {inf:"sell",        ps:"sold",        pp:"sold",          esp:"vender"},
  {inf:"send",        ps:"sent",        pp:"sent",          esp:"enviar"},
  {inf:"sing",        ps:"sang",        pp:"sung",          esp:"cantar"},
  {inf:"sit",         ps:"sat",         pp:"sat",           esp:"sentarse"},
  {inf:"sleep",       ps:"slept",       pp:"slept",         esp:"dormir"},
  {inf:"speak",       ps:"spoke",       pp:"spoken",        esp:"hablar"},
  {inf:"stand",       ps:"stood",       pp:"stood",         esp:"pararse"},
  {inf:"swim",        ps:"swam",        pp:"swum",          esp:"nadar"},
  {inf:"take",        ps:"took",        pp:"taken",         esp:"tomar"},
  {inf:"teach",       ps:"taught",      pp:"taught",        esp:"enseñar"},
  {inf:"tell",        ps:"told",        pp:"told",          esp:"contar"},
  {inf:"think",       ps:"thought",     pp:"thought",       esp:"pensar"},
  {inf:"understand",  ps:"understood",  pp:"understood",    esp:"entender"},
  {inf:"wear",        ps:"wore",        pp:"worn",          esp:"usar"},
  {inf:"write",       ps:"wrote",       pp:"written",       esp:"escribir"}
];

const MODES = [
  { id:'ps',   label:'Past simple',       color:'#4e73df', desc:'Ve el infinitivo → elige el past simple',       ask:'ps',  show:['inf','esp'] },
  { id:'pp',   label:'Past participle',   color:'#1cc88a', desc:'Ve el infinitivo → elige el past participle',   ask:'pp',  show:['inf','esp'] },
  { id:'esp',  label:'Español',           color:'#e67e22', desc:'Ve el infinitivo → elige la traducción',        ask:'esp', show:['inf'] },
  { id:'inf',  label:'Infinitivo',        color:'#9b59b6', desc:'Ve la traducción → elige el infinitivo',        ask:'inf', show:['esp'] },
  { id:'pspp', label:'PS + PP mezclados', color:'#e74c3c', desc:'Mezcla de past simple y past participle',       ask:'both',show:['inf','esp'] },
  { id:'all',  label:'Todo mezclado',     color:'#2c3e50', desc:'Mezcla de PS, PP, español e infinitivo',        ask:'all', show:[] }
];

let selectedMode = MODES[0];
let queue = [];
let corrects = 0, wrongs = 0;
let answered = false;

function buildModeUI() {
  const grid = document.getElementById('mode-grid');
  grid.innerHTML = '';
  MODES.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'mode-btn' + (m.id === selectedMode.id ? ' active' : '');
    btn.textContent = m.label;
    btn.style.borderColor = m.id === selectedMode.id ? m.color : '';
    btn.style.color = m.id === selectedMode.id ? m.color : '';
    btn.onclick = () => { selectedMode = m; buildModeUI(); document.getElementById('mode-desc').textContent = m.desc; document.getElementById('btn-start').style.background = m.color; };
    grid.appendChild(btn);
  });
  document.getElementById('mode-desc').textContent = selectedMode.desc;
  document.getElementById('btn-start').style.background = selectedMode.color;
}

function shuffle(arr) {
  let a = [...arr];
  for (let i = a.length-1; i > 0; i--) { let j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function buildQueue() {
  const ask = selectedMode.ask;
  if (ask === 'ps' || ask === 'pp' || ask === 'esp' || ask === 'inf')
    return shuffle(verbos).map(v => ({v, ask}));
  if (ask === 'both')
    return shuffle([...verbos.map(v=>({v,ask:'ps'})), ...verbos.map(v=>({v,ask:'pp'}))]);
  // all
  const all = [];
  verbos.forEach(v => { ['ps','pp','esp','inf'].forEach(a => all.push({v,ask:a})); });
  return shuffle(all);
}

function iniciar() {
  queue = buildQueue();
  corrects = 0; wrongs = 0;
  document.getElementById('screen-menu').style.display = 'none';
  document.getElementById('screen-game').style.display = 'block';
  document.getElementById('screen-final').style.display = 'none';
  document.getElementById('pbar').style.background = selectedMode.color;
  actualizarStats();
  mostrarVerbo();
}

function mostrarVerbo() {
  if (queue.length === 0) { mostrarFinal(); return; }
  answered = false;
  const {v, ask} = queue[0];

  const askLabels = { ps:'¿Past simple?', pp:'¿Past participle?', esp:'¿Qué significa en español?', inf:'¿Cuál es el infinitivo?' };
  const askColors = { ps:'#4e73df', pp:'#1cc88a', esp:'#e67e22', inf:'#9b59b6' };
  const topLabels = { ps:'Infinitivo', pp:'Infinitivo', esp:'Infinitivo', inf:'Español' };
  const mainVal   = { ps:v.inf, pp:v.inf, esp:v.inf, inf:v.esp };
  const subVal    = { ps:'('+v.esp+')', pp:'('+v.esp+')', esp:'', inf:'' };

  document.getElementById('v-top').textContent = topLabels[ask];
  document.getElementById('v-main').textContent = mainVal[ask];
  document.getElementById('v-sub').textContent = subVal[ask];

  const badge = document.getElementById('ask-badge');
  badge.textContent = askLabels[ask];
  badge.style.background = askColors[ask] + '22';
  badge.style.color = askColors[ask];

  // hints for 'all' mode
  const hintsEl = document.getElementById('hints');
  hintsEl.innerHTML = '';
  if (selectedMode.ask === 'all' || selectedMode.ask === 'both') {
    const show = ask === 'ps' ? [{l:'Past participle', k:'pp'}]
               : ask === 'pp' ? [{l:'Past simple', k:'ps'}]
               : ask === 'esp' ? [{l:'Past simple', k:'ps'},{l:'Past participle', k:'pp'}]
               : [{l:'Past simple', k:'ps'},{l:'Past participle', k:'pp'}];
    show.forEach(h => {
      hintsEl.innerHTML += `<div class="hint-box"><div class="hint-lbl">${h.l}</div><div class="hint-val">${v[h.k]}</div></div>`;
    });
  }

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('btn-next').style.display = 'none';

  const correct = v[ask];
  const pool = shuffle(verbos.filter(x => x[ask] !== correct)).slice(0,3).map(x => x[ask]);
  const options = shuffle([correct, ...pool]);

  const optsEl = document.getElementById('opts');
  optsEl.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => elegir(btn, opt, correct);
    optsEl.appendChild(btn);
  });
}

function elegir(btn, chosen, correct) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.textContent === correct) b.classList.add('correct'); });
  const fb = document.getElementById('feedback');
  if (chosen === correct) {
    corrects++; btn.classList.add('correct');
    fb.textContent = '¡Correcto!'; fb.className = 'feedback ok';
  } else {
    wrongs++; btn.classList.add('wrong');
    fb.textContent = 'Incorrecto — era: ' + correct; fb.className = 'feedback no';
  }
  actualizarStats();
  document.getElementById('btn-next').style.display = 'block';
}

function siguiente() { queue.shift(); actualizarStats(); mostrarVerbo(); }

function actualizarStats() {
  const totals = { ps:50, pp:50, esp:50, inf:50, both:100, all:200 };
  const total = totals[selectedMode.ask] || 50;
  document.getElementById('sc-ok').textContent = corrects;
  document.getElementById('sc-bad').textContent = wrongs;
  document.getElementById('sc-left').textContent = queue.length;
  document.getElementById('pbar').style.width = (((corrects+wrongs)/total)*100).toFixed(0) + '%';
}

function mostrarFinal() {
  document.getElementById('screen-game').style.display = 'none';
  document.getElementById('screen-final').style.display = 'block';
  const totals = { ps:50, pp:50, esp:50, inf:50, both:100, all:200 };
  const total = totals[selectedMode.ask] || 50;
  const pct = Math.round((corrects/total)*100);
  document.getElementById('final-score').textContent = corrects + ' / ' + total;
  document.getElementById('final-msg').textContent = pct >= 80 ? '¡Excelente trabajo!' : pct >= 50 ? 'Buen intento, sigue practicando.' : 'Sigue repasando, tú puedes.';
  document.getElementById('final-emoji').textContent = pct >= 80 ? '🏆' : pct >= 50 ? '💪' : '📚';
  document.getElementById('btn-replay').style.background = selectedMode.color;
}

function volver() {
  document.getElementById('screen-final').style.display = 'none';
  document.getElementById('screen-menu').style.display = 'block';
}

buildModeUI();
</script>
